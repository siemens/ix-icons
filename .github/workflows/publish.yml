name: Release

on:
  push:
    branches:
      - main
      - 'release/v*.*.*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write

jobs:
  release:
    if: ${{ github.repository == 'siemens/ix-icons' }}
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/workflows/actions/build

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@^11.8.0 --no-man

      - name: Select npm publish command
        id: publish-command
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "command=pnpm ci:publish --publish-branch main" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^release/v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "command=pnpm ci:publish --tag v${BASH_REMATCH[1]}-lts" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No npm dist-tag configured for branch $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          publish: ${{ steps.publish-command.outputs.command }}
          version: pnpm ci:version
